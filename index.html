<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090909"
  >

  <title>JohnnyTech × Naruto</title>

  <link
    rel="stylesheet"
    href="./css/main.css"
  >
</head>

<body>

  <div id="app">

    <header class="app-header">

      <div class="brand">
        <span class="brand-main">
          JohnnyTech
        </span>

        <span class="brand-x">
          ×
        </span>

        <span class="brand-theme">
          Naruto
        </span>
      </div>

      <button
        id="search-button"
        class="header-button"
        aria-label="Search"
      >
        🔍
      </button>

    </header>

    <main id="main-screen">
      <!-- Pages are loaded here -->
    </main>

    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-page="home"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button
        class="nav-item"
        data-page="search"
      >
        <span>⌕</span>
        <small>Search</small>
      </button>

      <button
        class="nav-center"
        data-page="player"
        aria-label="Player"
      >
        ▶
      </button>

      <button
        class="nav-item"
        data-page="library"
      >
        <span>▣</span>
        <small>Library</small>
      </button>

      <button
        class="nav-item"
        data-page="settings"
      >
        <span>⚙</span>
        <small>Settings</small>
      </button>

    </nav>

  </div>

  <script
    type="module"
    src="./main.js"
  ></script>

</body>
</html>
