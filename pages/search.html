<section class="search-page">

  <div class="search-header">
    <button
      id="search-back"
      class="back-button"
      aria-label="Go back"
    >
      ←
    </button>

    <div>
      <p class="page-label">
        DISCOVER
      </p>

      <h1>Search Anime</h1>
    </div>
  </div>

  <div class="search-box">

    <span class="search-icon">
      🔍
    </span>

    <input
      id="anime-search-input"
      type="search"
      placeholder="Search anime..."
      autocomplete="off"
    >

    <button
      id="clear-search"
      class="clear-search"
      aria-label="Clear search"
    >
      ×
    </button>

  </div>

  <div
    id="search-status"
    class="search-status"
  >
    Search for an anime to begin.
  </div>

  <section
    id="search-results"
    class="search-results"
  ></section>

</section>
