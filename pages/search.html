<section class="search-page">

  <div class="search-header">

    <button
      id="search-back"
      class="back-button"
      type="button"
      aria-label="Go back"
    >
      ←
    </button>

    <div>
      <p class="page-label">
        DISCOVER
      </p>

      <h1>Search Anime</h1>
    </div>

  </div>

  <form
    id="anime-search-form"
    class="search-box"
  >

    <span
      class="search-icon"
      aria-hidden="true"
    >
      🔍
    </span>

    <input
      id="anime-search-input"
      type="search"
      placeholder="Search anime..."
      autocomplete="off"
      enterkeyhint="search"
    >

    <button
      id="clear-search"
      class="clear-search"
      type="button"
      aria-label="Clear search"
    >
      ×
    </button>

    <button
      id="submit-search"
      class="submit-search"
      type="submit"
    >
      Search
    </button>

  </form>

  <div
    id="search-status"
    class="search-status"
  >
    Search for an anime to begin.
  </div>

  <section
    id="search-results"
    class="search-results"
  ></section>

</section>
