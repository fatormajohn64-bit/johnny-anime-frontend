<section class="settings-page">

  <div class="settings-topbar">
    <span>SETTINGS</span>
  </div>

  <div class="settings-content">

    <div class="settings-section">
      <h2>Player</h2>

      <label class="settings-toggle">
        <div>
          <div class="settings-toggle-title">Autoplay next episode</div>
          <div class="settings-toggle-description">
            Automatically start the next episode when one ends.
          </div>
        </div>

        <input type="checkbox" id="setting-autoplay-next">
      </label>

      <label class="settings-toggle">
        <div>
          <div class="settings-toggle-title">Resume automatically</div>
          <div class="settings-toggle-description">
            Jump back to your saved position when opening an episode.
          </div>
        </div>

        <input type="checkbox" id="setting-auto-resume">
      </label>
    </div>

    <div class="settings-section">
      <h2>App</h2>

      <button id="clear-local-data" class="settings-danger-button" type="button">
        Clear Local Downloads &amp; Library
      </button>

      <p class="settings-hint">
        This clears what's saved on this device only. It does not affect the backend.
      </p>
    </div>

    <div class="settings-section">
      <h2>About</h2>

      <p class="settings-about">
        Johnny Anime Vault<br>
        A personal anime library and player.
      </p>
    </div>

  </div>

</section>
