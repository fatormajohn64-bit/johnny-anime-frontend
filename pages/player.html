<section class="player-page">

  <div class="player-topbar">
    <button
      id="player-back"
      class="player-back"
      aria-label="Go back"
    >
      ←
    </button>

    <div class="player-heading">
      <span>NOW PLAYING</span>
      <strong id="player-anime-title">
        JohnnyTech × Naruto
      </strong>
    </div>
  </div>


  <main class="player-content">

    <section class="video-container">

      <video
        id="anime-video"
        class="anime-video"
        controls
        playsinline
        preload="metadata"
      ></video>

      <div
        id="video-placeholder"
        class="video-placeholder"
      >
        <div class="video-placeholder-icon">
          ▶
        </div>

        <h2>
          Select an episode
        </h2>

        <p>
          Choose an episode from the
          anime page to start watching.
        </p>
      </div>

    </section>


    <section class="player-info">

      <div class="player-title-row">

        <div>
          <p class="player-label">
            EPISODE
          </p>

          <h1 id="player-episode-title">
            No episode selected
          </h1>
        </div>

        <span
          id="player-episode-number"
          class="player-episode-number"
        >
          —
        </span>

      </div>


      <div class="player-progress-info">

        <div>
          <span>Progress</span>

          <strong
            id="player-progress-text"
          >
            0%
          </strong>
        </div>

        <div class="player-progress-track">
          <div
            id="player-progress-bar"
            class="player-progress-bar"
          ></div>
        </div>

      </div>


      <div class="player-controls">

        <button
          id="previous-episode"
          class="player-control-button"
        >
          ‹
          <span>Previous</span>
        </button>

        <button
          id="next-episode"
          class="player-control-button"
        >
          <span>Next</span>
          ›
        </button>

      </div>

    </section>


    <section class="source-section">

      <div class="section-heading">
        <h2>Video Sources</h2>
      </div>

      <div
        id="video-source-list"
        class="video-source-list"
      >
        <div class="player-loading">
          Loading sources...
        </div>
      </div>

    </section>

  </main>

</section>
