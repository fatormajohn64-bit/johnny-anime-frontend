<section class="anime-page">

  <div class="anime-topbar">
    <button
      id="anime-back"
      class="anime-back"
      aria-label="Go back"
    >
      ←
    </button>

    <span>
      ANIME DETAILS
    </span>
  </div>

  <section
    id="anime-hero"
    class="anime-hero"
  >
    <div
      id="anime-banner"
      class="anime-banner"
    ></div>

    <div class="anime-hero-content">

      <div
        id="anime-poster"
        class="anime-poster"
      ></div>

      <div class="anime-info">

        <p
          id="anime-format"
          class="anime-format-label"
        >
          ANIME
        </p>

        <h1 id="anime-title">
          Loading...
        </h1>

        <p
          id="anime-alt-titles"
          class="anime-alt-titles"
        ></p>

        <p
          id="anime-meta"
          class="anime-meta"
        ></p>

        <p
          id="anime-description"
          class="anime-description"
        ></p>

        <div class="anime-actions">

          <button
            id="watch-anime"
            class="anime-primary-button"
          >
            ▶ Watch
          </button>

          <button
            id="add-library"
            class="anime-secondary-button"
          >
            ＋ Add to Library
          </button>

          <button
            id="favorite-anime"
            class="anime-secondary-button"
          >
            ♡ Favorite
          </button>

        </div>

      </div>

    </div>
  </section>

  <section class="anime-content">

    <div class="section-heading">
      <h2>Seasons</h2>
    </div>

    <div
      id="season-list"
      class="season-list"
    ></div>

    <div
      id="episode-section"
      class="episode-section"
    >

      <div class="section-heading">
        <h2>Episodes</h2>
      </div>

      <div
        id="download-toolbar"
        class="download-toolbar"
      >
        <label class="download-select-all">
          <input
            type="checkbox"
            id="select-all-episodes"
          >
          Select All
        </label>

        <button
          id="download-selected"
          class="download-button"
          type="button"
          disabled
        >
          Download Selected
        </button>

        <button
          id="download-all"
          class="download-button download-button-outline"
          type="button"
        >
          Download All Episodes
        </button>
      </div>

      <p
        id="download-status"
        class="download-status"
      ></p>

      <div
        id="episode-list"
        class="episode-list"
      ></div>

    </div>

  </section>

</section>
